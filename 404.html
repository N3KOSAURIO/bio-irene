<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7c4df">
  <title>Esta página no existe | Irene Mendoza</title>
  <link rel="icon" type="image/png" sizes="192x192" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      background: #fce8f2;
      color: #211323;
      font-family: "DM Sans", system-ui, sans-serif;
      text-align: center;
    }
    .card {
      width: min(100%, 420px);
      padding: 38px 30px 34px;
      border-radius: 30px;
      background: rgba(255, 255, 255, .72);
      box-shadow: 0 22px 50px rgba(120, 20, 80, .16);
    }
    h1 { margin: 0 0 10px; font-family: "Playfair Display", serif; font-size: clamp(1.7rem, 7vw, 2.1rem); }
    p { margin: 0 0 22px; color: #6b4a5f; line-height: 1.55; }
    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 0 26px;
      border-radius: 999px;
      background: linear-gradient(120deg, #ec1685, #a90058);
      color: #fff;
      font-weight: 600;
      text-decoration: none;
    }
    a:focus-visible { outline: 3px solid #7414a8; outline-offset: 3px; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Este enlace no existe</h1>
    <p>Puede que se haya movido o que el enlace esté incompleto. Vuelve a mi página principal y desde ahí apartas tu cita.</p>
    <a href="/">Ir a mi página</a>
  </main>
</body>
</html>
